<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مفاجأة ليولا 💖</title>
    <!-- مكتبة لعمل تأثير الفرقعة (Confetti) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        /* إعدادات الخلفية والخطوط */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffdae9; /* لون بينك هادئ */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* حاوية إدخال الرقم السري */
        #login-container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(255, 105, 180, 0.3);
            z-index: 10;
            transition: all 0.5s ease;
        }

        h2 {
            color: #ff4d94;
            margin-bottom: 20px;
        }

        input {
            padding: 12px;
            width: 200px;
            border: 2px solid #ffb3d1;
            border-radius: 10px;
            outline: none;
            text-align: center;
            font-size: 18px;
            color: #ff4d94;
        }

        button {
            padding: 12px 25px;
            margin-top: 15px;
            background-color: #ff4d94;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        button:hover {
            background-color: #ff1a75;
            transform: scale(1.05);
        }

        /* حاوية الرسالة المفاجئة */
        #surprise-container {
            display: none;
            text-align: center;
        }

        /* نص "بعشقك يا يولا" الملون والمتحرك */
        .animated-text {
            font-size: 4rem;
            font-weight: bold;
            background: linear-gradient(to right, #ff0080, #ff8c00, #40e0d0, #ff0080);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textFlow 3s linear infinite, bounce 2s infinite;
            display: inline-block;
        }

        /* حركة الألوان */
        @keyframes textFlow {
            to { background-position: 200% center; }
        }

        /* حركة القفز المبهجة */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        /* إضافة قلوب في الخلفية */
        .heart {
            position: absolute;
            color: #ff4d94;
            font-size: 20px;
            animation: float 5s linear infinite;
            opacity: 0.6;
        }

        @keyframes float {
            from { transform: translateY(100vh); opacity: 1; }
            to { transform: translateY(-10vh); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- حاوية الدخول -->
    <div id="login-container">
        <h2>أدخلي الرقم السري يا قمر 💖</h2>
        <input type="password" id="passwordInput" placeholder="الرقم السري هنا...">
        <br>
        <button onclick="checkPassword()">دخول ✨</button>
        <p id="error-msg" style="color: red; margin-top: 10px; display: none;">الرقم غلط يا يولا! ركزي 😉</p>
    </div>

    <!-- حاوية المفاجأة -->
    <div id="surprise-container">
        <h1 class="animated-text">بعشقك يا يولا ❤️✨</h1>
    </div>

    <script>
        function checkPassword() {
            const pass = document.getElementById('passwordInput').value;
            const correctPass = "2772026";

            if (pass === correctPass) {
                // إخفاء صندوق الدخول
                document.getElementById('login-container').style.display = 'none';
                
                // إظهار المفاجأة
                const surprise = document.getElementById('surprise-container');
                surprise.style.display = 'block';

                // تشغيل تأثير الفرقعة (Confetti)
                fireCelebration();
                
                // إضافة قلوب متحركة
                setInterval(createHeart, 300);

            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        // دالة الفرقعات الملونة
        function fireCelebration() {
            var duration = 5 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 7,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ff0080', '#ffb3d1', '#ffffff', '#ff4d94']
                });
                confetti({
                    particleCount: 7,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#ff0080', '#ffb3d1', '#ffffff', '#ff4d94']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        // دالة إنشاء القلوب في الخلفية
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }
    </script>
</body>
</html>
